<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chat · NODO · NEVADO</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <link rel="preconnect" href="https://clerk.nevado.pro" crossorigin />
  <script
    data-clerk-publishable-key="pk_live_Y2xlcmsubmV2YWRvLnBybyQ"
    src="https://clerk.nevado.pro/npm/@clerk/clerk-js@latest/dist/clerk.browser.js"
    type="text/javascript">
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Geist:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/nodo.css" />
  <style>
    :root { --topbar-h: 52px; --sidebar-w: 220px; }
    #topbar {
      position: fixed; top: 0; left: 0; right: 0; z-index: 900;
      height: 52px; display: flex; align-items: center;
      justify-content: space-between; padding: 0 28px;
      background: rgba(5,5,10,0.97);
      backdrop-filter: blur(24px);
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    .topbar-logo { font-size: 13px; font-weight: 600; letter-spacing: 0.14em; color: rgba(232,228,220,0.88); text-decoration: none; font-family: 'Cormorant Garamond', serif; }
    .topbar-logo span { color: #E74C3C; }
    .topbar-back { font-size: 11px; color: rgba(255,255,255,0.45); text-decoration: none; }
    .topbar-back:hover { color: rgba(255,255,255,0.8); }
    .topbar-session { display: flex; align-items: center; gap: 8px; font-size: 12px; }
    .topbar-session-name { color: rgba(232,232,224,0.75); font-weight: 500; }
    .topbar-session-rank { width: 22px; height: 22px; object-fit: contain; }

    /* ── Layout ── */
    .chat-layout {
      display: flex;
      height: calc(100vh - var(--topbar-h));
      margin-top: var(--topbar-h);
      overflow: hidden;
    }

    /* ── Channels sidebar ── */
    .chat-sidebar {
      width: var(--sidebar-w);
      border-right: 1px solid rgba(255,255,255,0.06);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .chat-sidebar-header {
      padding: 14px 16px 10px;
      font-size: 9px;
      font-weight: 600;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.34);
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    #nodo-canales-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px 0;
    }
    .nodo-canal-item {
      display: block;
      padding: 8px 16px;
      font-size: 13px;
      color: rgba(255,255,255,0.45);
      background: none;
      border: none;
      text-align: left;
      cursor: pointer;
      font-family: inherit;
      border-radius: 6px;
      margin: 1px 8px;
      width: calc(100% - 16px);
      transition: color 0.2s, background 0.2s;
    }
    .nodo-canal-item:hover { color: rgba(255,255,255,0.8); background: rgba(255,255,255,0.04); }
    .nodo-canal-item.active { color: #E74C3C; background: rgba(231,76,60,0.08); }
    .nodo-canal-anuncio { color: #B8944A !important; }
    .nodo-canal-anuncio.active { color: #B8944A !important; background: rgba(184,148,74,0.08) !important; }

    /* ── Main chat area ── */
    .chat-main {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .chat-header {
      padding: 12px 20px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }
    #nodo-chan-title {
      font-size: 14px;
      font-weight: 500;
      color: #E8E8E0;
    }
    .chat-header-live {
      font-size: 9px;
      font-weight: 600;
      letter-spacing: 0.1em;
      color: #27AE60;
      background: rgba(39,174,96,0.1);
      padding: 2px 7px;
      border-radius: 20px;
      border: 1px solid rgba(39,174,96,0.2);
    }

    /* ── Messages ── */
    #nodo-chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    #nodo-chat-messages::-webkit-scrollbar { width: 4px; }
    #nodo-chat-messages::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 2px; }

    .nodo-chat-msg {
      display: flex;
      align-items: flex-start;
      gap: 10px;
    }
    .nodo-chat-msg-own { flex-direction: row-reverse; }

    .nodo-chat-rank-img {
      width: 30px; height: 30px;
      object-fit: contain;
      flex-shrink: 0;
    }

    .nodo-chat-bubble {
      max-width: 65%;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 12px;
      padding: 8px 12px;
    }
    .nodo-chat-msg-own .nodo-chat-bubble {
      background: rgba(231,76,60,0.1);
      border-color: rgba(231,76,60,0.2);
    }
    .nodo-chat-author {
      display: flex;
      align-items: baseline;
      gap: 5px;
      margin-bottom: 4px;
      flex-wrap: wrap;
    }
    .nodo-chat-author-name {
      font-size: 12px;
      font-weight: 600;
      color: #E8E8E0;
    }
    .nodo-chat-username {
      font-size: 10px;
      color: rgba(184,148,74,0.85);
    }
    .nodo-chat-author-rank {
      font-size: 10px;
      color: rgba(255,255,255,0.3);
    }
    .nodo-chat-text {
      font-size: 13px;
      line-height: 1.55;
      color: rgba(232,232,224,0.85);
      word-break: break-word;
    }
    .nodo-chat-time {
      font-size: 10px;
      color: rgba(255,255,255,0.28);
      margin-top: 4px;
      text-align: right;
    }
    .nodo-chat-loading,
    .nodo-chat-empty {
      font-size: 13px;
      color: rgba(255,255,255,0.28);
      text-align: center;
      padding: 32px 0;
    }

    /* ── Typing indicator ── */
    #chat-typing-indicator {
      min-height: 18px;
      padding: 0 20px 2px;
      font-size: 11px;
      color: rgba(255,255,255,0.32);
      font-style: italic;
      flex-shrink: 0;
    }

    /* ── Emoji bar ── */
    #chat-emoji-bar {
      display: flex;
      gap: 4px;
      padding: 6px 20px 0;
      flex-shrink: 0;
    }
    .chat-emoji-btn {
      background: none;
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 6px;
      padding: 3px 7px;
      font-size: 15px;
      cursor: pointer;
      line-height: 1;
      transition: background 0.15s;
    }
    .chat-emoji-btn:hover { background: rgba(255,255,255,0.06); }

    /* ── Input row ── */
    .chat-input-row {
      padding: 8px 20px 14px;
      border-top: 1px solid rgba(255,255,255,0.06);
      display: flex;
      gap: 8px;
      align-items: flex-end;
      flex-shrink: 0;
    }
    #nodo-chat-input {
      flex: 1;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 14px;
      color: #E8E8E0;
      font-family: inherit;
      outline: none;
      resize: none;
      min-height: 40px;
      max-height: 120px;
      line-height: 1.4;
      transition: border-color 0.2s;
    }
    #nodo-chat-input:focus { border-color: rgba(231,76,60,0.35); }
    #nodo-chat-input::placeholder { color: rgba(255,255,255,0.28); }
    #nodo-chat-send {
      background: #E74C3C;
      color: #fff;
      border: none;
      width: 38px; height: 38px;
      border-radius: 9px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      transition: opacity 0.2s;
    }
    #nodo-chat-send:hover { opacity: 0.85; }
    .chat-login-notice {
      padding: 12px 20px;
      border-top: 1px solid rgba(255,255,255,0.06);
      font-size: 12px;
      color: rgba(255,255,255,0.38);
      text-align: center;
      flex-shrink: 0;
    }
    .chat-login-notice a { color: #E74C3C; }

    @media (max-width: 640px) {
      .chat-sidebar { display: none; }
    }
  </style>
</head>
<body>
  <header id="topbar">
    <a class="topbar-logo" href="/">N<span>·</span>EVADO</a>
    <a class="topbar-back" href="/nodo.html">← NODO</a>
    <div id="topbar-session" class="topbar-session"></div>
  </header>

  <div class="chat-layout">
    <!-- Channels -->
    <aside class="chat-sidebar">
      <div class="chat-sidebar-header">Canales</div>
      <div id="nodo-canales-list">
        <div style="padding:12px 16px;font-size:12px;color:rgba(255,255,255,0.28);">Cargando…</div>
      </div>
    </aside>

    <!-- Chat main -->
    <div class="chat-main">
      <div class="chat-header">
        <span id="nodo-chan-title"># general</span>
        <span class="chat-header-live">● VIVO</span>
      </div>

      <div id="nodo-chat-messages">
        <div class="nodo-chat-loading">Selecciona un canal.</div>
      </div>

      <div id="chat-emoji-bar">
        <button class="chat-emoji-btn" data-emoji="👍" type="button">👍</button>
        <button class="chat-emoji-btn" data-emoji="🔥" type="button">🔥</button>
        <button class="chat-emoji-btn" data-emoji="❤️" type="button">❤️</button>
        <button class="chat-emoji-btn" data-emoji="🇻🇪" type="button">🇻🇪</button>
        <button class="chat-emoji-btn" data-emoji="😂" type="button">😂</button>
        <button class="chat-emoji-btn" data-emoji="✅" type="button">✅</button>
      </div>

      <div id="typing-indicator" style="display:none;color:rgba(255,255,255,.4);font-size:11px;padding:4px 20px;font-style:italic;"></div>

      <div class="chat-input-row" id="chat-input-row">
        <textarea id="nodo-chat-input" rows="1" placeholder="Escribe un mensaje… (Enter para enviar)"></textarea>
        <button id="nodo-chat-send" type="button" aria-label="Enviar">
          <svg width="16" height="16" viewBox="0 0 14 14" fill="none">
            <path d="M2 7h10M8 3l4 4-4 4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>
      <div class="chat-login-notice" id="chat-login-notice" style="display:none">
        <a href="/auth.html?redirect=/nodo-chat.html">Inicia sesión</a> para participar en el chat.
      </div>
    </div>
  </div>

  <script src="/cursor.js"></script>
  <script src="/nevado-env.js"></script>
  <script src="/js/nodo/nodo-core.js"></script>
  <script src="/js/nodo/nodo-foro.js"></script>
  <script src="/js/nodo/nodo-chat.js"></script>

  <script>
    /* FIX 9E — kick off session resolution so nodo:ready fires */
    document.addEventListener('DOMContentLoaded', function () {
      if (window.NODO && window.NODO.initClerkSession) window.NODO.initClerkSession();
    });

    var RANK_SM_MAP = {
      cachorro:       '/rangos/rango1-cachorro-bronce-sm.webp',
      explorador:     '/rangos/rango2-explorador-bronce-sm.webp',
      guardian:       '/rangos/rango3-guardian-plata-sm.webp',
      montanista:     '/rangos/rango4-montanista-plata-sm.webp',
      guia:           '/rangos/rango5-guia-plata-sm.webp',
      protector:      '/rangos/rango6-protector-oro-sm.webp',
      leyenda_andina: '/rangos/rango7-leyendaandina-oro-joyas-sm.webp',
    };

    document.addEventListener('nodo:ready', function (ev) {
      var user        = ev.detail && ev.detail.user;
      var inputRow    = document.getElementById('chat-input-row');
      var emojiBar    = document.getElementById('chat-emoji-bar');
      var loginNotice = document.getElementById('chat-login-notice');
      var sessionEl   = document.getElementById('topbar-session');
      var chatInput   = document.getElementById('nodo-chat-input');

      /* Expose CHAT_USER for nodo-chat.js */
      window.CHAT_USER = user || null;
      console.log('[chat] nodo:ready — CHAT_USER:', window.CHAT_USER);

      if (!user) {
        if (inputRow)    inputRow.style.display    = 'none';
        if (emojiBar)    emojiBar.style.display    = 'none';
        if (loginNotice) loginNotice.style.display = '';
        if (chatInput) {
          chatInput.disabled     = true;
          chatInput.placeholder  = 'Inicia sesión para chatear';
          chatInput.style.borderColor = 'rgba(231,76,60,0.35)';
        }
      } else {
        window.CHAT_USER = user;
        if (sessionEl) {
          var rankSrc = RANK_SM_MAP[user.rank_key] || RANK_SM_MAP.cachorro;
          sessionEl.innerHTML =
            '<img class="topbar-session-rank" src="' + rankSrc + '" alt="" />' +
            '<span class="topbar-session-name">' + (user.display_name || '') + '</span>';
        }
        if (chatInput) {
          chatInput.disabled    = false;
          chatInput.placeholder = 'Escribe un mensaje… (Enter para enviar)';
        }
      }
    });
  </script>
</body>
</html>
