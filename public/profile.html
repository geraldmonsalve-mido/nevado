  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(rgba(2,3,10,.45), rgba(2,3,10,.94)), url('/fondo.png');
      background-size: cover;
      background-position: center;
      color: white;
      font-family: Inter, system-ui, sans-serif;
      display: grid;
      place-items: center;
      padding: 40px 18px;
    }
    .card {
      width: min(780px, 94vw);
      padding: 42px;
      border-radius: 34px;
      border: 1px solid rgba(255,215,120,.22);
      background: rgba(8,10,18,.82);
      backdrop-filter: blur(26px);
      text-align: center;
      box-shadow: 0 30px 90px rgba(0,0,0,.52);
    }
    .avatar {
      width: 116px;
      height: 116px;
      border-radius: 999px;
      object-fit: cover;
      border: 2px solid rgba(255,215,120,.5);
      background: rgba(255,255,255,.06);
      margin-bottom: 22px;
    }
    h1 {
      margin: 0;
      font-family: Georgia, serif;
      font-size: clamp(38px, 7vw, 62px);
      font-weight: 400;
      letter-spacing: .08em;
    }
    .rank {
      margin: 14px 0 28px;
      color: #c8a74d;
      letter-spacing: .32em;
      text-transform: uppercase;
      font-size: 12px;
      font-weight: 800;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
      margin: 28px 0;
    }
    .metric {
      padding: 22px;
      border-radius: 20px;
      background: rgba(255,255,255,.055);
      border: 1px solid rgba(255,255,255,.08);
    }
    .metric span {
      display: block;
      opacity: .65;
      margin-bottom: 8px;
    }
    .metric strong {
      font-size: 26px;
    }
    .info {
      text-align: left;
      line-height: 1.7;
      padding: 24px;
      border-radius: 22px;
      background: rgba(255,255,255,.045);
      border: 1px solid rgba(255,255,255,.08);
      margin: 26px 0;
    }
    .info b { color: #f6d98b; }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
      margin-top: 24px;
    }
    a, button {
      padding: 14px 18px;
      border-radius: 15px;
      border: 1px solid rgba(255,255,255,.14);
      background: rgba(255,255,255,.055);
      color: white;
      text-decoration: none;
      font-weight: 800;
      cursor: pointer;
    }
    .founder-btn {
      border-color: rgba(255,215,120,.45);
      background: rgba(200,148,44,.20);
      color: #f6d98b;
      box-shadow: 0 0 24px rgba(200,148,44,.14);
    }
    .founder-btn:hover {
      background: rgba(200,148,44,.34);
      color: #fff2c4;
    }
  </style>
</head>

<body>
  <main id="profile-card" class="card">Cargando perfil...</main>

  <script>
const rankNames = {
      cachorro: "Cachorro",
      explorador: "Explorador",
      guardian: "Guardián",
      montanista: "Montañista",
      guia: "Guía",
      protector: "Protector",
      leyenda_andina: "Leyenda Andina"
    };

    const nextRank = {
      cachorro: { name: "Explorador", required: 1000 },
      explorador: { name: "Guardián", required: 2000 },
      guardian: { name: "Montañista", required: 3200 },
      montanista: { name: "Guía", required: 5450 },
      guia: { name: "Protector", required: 8450 },
      protector: { name: "Leyenda Andina", required: 16450 },
      leyenda_andina: { name: "Rango máximo", required: 0 }
    };

    function fallbackAvatar(profile) {
      if (profile.username === "nevado") return "/NevadoDePie.png";
      return window.Clerk?.user?.imageUrl || "/NevadoUtil.png";
    }

    window.addEventListener("load", async () => {
      const card = document.getElementById("profile-card");

      try {
        await window.Clerk.load();

        const clerkUser = window.Clerk.user;
        if (!clerkUser) {
          window.location.href = "/auth.html";
          return;
        }

        const { data: profile, error } = await window.nevadoDb
          .from("profiles")
          .select("*")
          .eq("clerk_id", clerkUser.id)
          .single();

        console.log("CLERK USER", clerkUser);
        console.log("PROFILE DATA", profile);
        console.log("PROFILE ERROR", error);

        if (error || !profile) {
          card.innerHTML = "Error cargando perfil.";
          return;
        }

        const rank = rankNames[profile.rank_key] || profile.rank_key || "Cachorro";
        const next = nextRank[profile.rank_key] || nextRank.cachorro;
        const needed = Math.max((next.required || 0) - Number(profile.croquetas || 0), 0);

        const avatar = profile.avatar_url || fallbackAvatar(profile);

        const founderButton = (
          profile.is_founder === true ||
          profile.username === "nevado" ||
          profile.role === "FOUNDER"
        )
          ? '<a class="founder-btn" href="/founder-panel.html">Panel de Control</a>'
          : '';

        card.innerHTML = `
          <img class="avatar" src="${avatar}" onerror="this.onerror=null; this.src='/NevadoUtil.png';" />
          <h1>${profile.display_name || "Usuario NEVADO"}</h1>
          <div class="rank">${rank}</div>

          <section class="grid">
            <div class="metric"><span>Nivel</span><strong>${profile.level || 1}</strong></div>
            <div class="metric"><span>Croquetas</span><strong>${Number(profile.croquetas || 0).toLocaleString("es-VE")}</strong></div>
            <div class="metric"><span>Rango actual</span><strong>${rank}</strong></div>
            <div class="metric"><span>Croquetas para ascender</span><strong>${next.required === 0 ? "Rango máximo" : needed.toLocaleString("es-VE") + " 🦴"}</strong></div>
          </section>

          <section class="info">
            ${next.required === 0
              ? "Ya estás en el rango máximo del ecosistema NEVADO."
              : `Para ascender de <b>${rank}</b> a <b>${next.name}</b>, debes alcanzar <b>${next.required.toLocaleString("es-VE")} Croquetas acumuladas</b>.`
            }
            <br><br>
            En NEVADO no basta con acumular Croquetas: los rangos altos existen para reconocer permanencia, aporte real, criterio comunitario y compromiso con el ecosistema.
            <br><br>
            <a href="/rangos.html">Ver sistema completo de rangos</a>
          </section>

          <section class="actions">
            ${founderButton}
            <a href="/">Volver al ecosistema</a>
            <button id="logout">Cerrar sesión</button>
          </section>
        `;

        document.getElementById("logout").onclick = async () => {
          await window.Clerk.signOut();
          window.location.href = "/";
        };

      } catch (err) {
        console.error("PROFILE PAGE ERROR", err);
        card.innerHTML = "Error cargando perfil.";
      }
    });
  </script>
</body>
</html>
