<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Founder Panel — NEVADO</title>

<script
  async
  crossorigin="anonymous"
  data-clerk-publishable-key="pk_live_Y2xlcmsubmV2YWRvLnBybyQ"
  src="https://clerk.nevado.pro/npm/@clerk/clerk-js@latest/dist/clerk.browser.js">
</script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:Inter,system-ui,sans-serif;
background:
linear-gradient(rgba(2,3,10,.78),rgba(2,3,10,.95)),
url("/fondo.png");
background-size:cover;
background-position:center;
min-height:100vh;
color:white;
display:flex;
align-items:center;
justify-content:center;
overflow:hidden;
}

body::before{
content:"";
position:fixed;
inset:0;
background:
linear-gradient(rgba(255,255,255,.03) 1px,transparent 1px),
linear-gradient(90deg,rgba(255,255,255,.03) 1px,transparent 1px);
background-size:80px 80px;
pointer-events:none;
}

#app{
width:100%;
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
padding:40px;
}

.loading,
.denied{
width:min(520px,92vw);
padding:42px;
border-radius:30px;
background:rgba(5,8,18,.82);
border:1px solid rgba(255,215,120,.18);
backdrop-filter:blur(26px);
text-align:center;
}

.loading{
font-size:20px;
}

.denied h1{
font-size:38px;
margin-bottom:18px;
}

.denied p{
opacity:.7;
line-height:1.6;
}

.dashboard{
width:100%;
max-width:1450px;
display:grid;
grid-template-columns:320px 1fr;
gap:28px;
}

.sidebar{
padding:28px;
border-radius:34px;
background:rgba(5,8,18,.78);
border:1px solid rgba(255,215,120,.12);
backdrop-filter:blur(30px);
}

.main{
padding:34px;
border-radius:34px;
background:rgba(5,8,18,.74);
border:1px solid rgba(255,215,120,.12);
backdrop-filter:blur(30px);
}

.avatar{
width:130px;
height:130px;
border-radius:50%;
overflow:hidden;
margin:auto;
border:3px solid rgba(212,168,72,.6);
}

.avatar img{
width:100%;
height:100%;
object-fit:cover;
}

.title{
margin-top:22px;
font-size:46px;
font-weight:800;
line-height:1;
}

.subtitle{
margin-top:10px;
color:#d4a848;
letter-spacing:.22em;
text-transform:uppercase;
font-size:12px;
}

.grid{
margin-top:34px;
display:grid;
grid-template-columns:repeat(3,1fr);
gap:18px;
}

.card{
padding:24px;
border-radius:24px;
background:rgba(255,255,255,.04);
border:1px solid rgba(255,255,255,.06);
}

.card span{
display:block;
opacity:.6;
font-size:14px;
margin-bottom:12px;
}

.card strong{
font-size:32px;
}

.banner{
margin-top:28px;
padding:34px;
border-radius:30px;
background:
radial-gradient(circle at right,rgba(212,168,72,.22),transparent 35%),
rgba(255,255,255,.03);
border:1px solid rgba(255,215,120,.12);
}

.banner h2{
font-size:54px;
line-height:1;
margin-bottom:20px;
}

.banner p{
max-width:760px;
opacity:.78;
line-height:1.7;
font-size:18px;
}
</style>
</head>

<body>

<div id="app">
<div class="loading">
Validando sesión institucional...
</div>
</div>

<script>
const supabase = window.supabase.createClient(
"https://icxrduatkbazvwysvxrg.supabase.co",
"TU_SUPABASE_ANON_KEY"
)

async function boot(){

await window.Clerk.load()

const user = window.Clerk.user

if(!user){
renderDenied()
return
}

const clerkId = user.id
const email = user.primaryEmailAddress?.emailAddress || ""

const { data: profile, error } = await supabase
.from("profiles")
.select("*")
.eq("clerk_id", clerkId)
.single()

if(error || !profile){
renderDenied()
return
}

const isFounder =
profile.is_founder === true ||
email.includes("@nevado")

if(!isFounder){
renderDenied()
return
}

renderFounder(profile,user)
}

function renderDenied(){
document.getElementById("app").innerHTML = `
<div class="denied">
<h1>🔒 Acceso restringido</h1>
<p>
Solo cuentas institucionales del ecosistema pueden acceder
al centro de mando NEVADO.
</p>
</div>
`
}

function renderFounder(profile,user){

const avatar =
profile.avatar_url ||
user.imageUrl ||
"/NevadoDePie.png"

document.getElementById("app").innerHTML = `
<div class="dashboard">

<div class="sidebar">

<div class="avatar">
<img src="${avatar}">
</div>

<div class="title">
${profile.display_name || "Founder"}
</div>

<div class="subtitle">
${profile.rank_key || "FOUNDER"}
</div>

</div>

<div class="main">

<div class="banner">
<h2>Centro de mando institucional</h2>

<p>
Supervisa evaluaciones, croquetas, ascensos,
moderación y actividad completa del ecosistema.
</p>
</div>

<div class="grid">

<div class="card">
<span>Nivel</span>
<strong>${profile.level || 0}</strong>
</div>

<div class="card">
<span>Croquetas</span>
<strong>${Number(profile.croquetas || 0).toLocaleString("es-VE")}</strong>
</div>

<div class="card">
<span>Rol</span>
<strong>${profile.role || "FOUNDER"}</strong>
</div>

</div>

</div>

</div>
`
}

boot()
</script>

</body>
</html>
