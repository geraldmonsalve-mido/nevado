<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NEVADO — Panel Fundador</title>

  <script async crossorigin="anonymous"
    data-clerk-publishable-key="pk_live_Y2xlcmsubmV2YWRvLnBybyQ"
    src="https://clerk.nevado.pro/npm/@clerk/clerk-js@latest/dist/clerk.browser.js"
    type="text/javascript"></script>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(rgba(2,3,10,.58), rgba(2,3,10,.96)), url('/fondo.png');
      background-size: cover;
      background-position: center;
      color: white;
      font-family: Inter, system-ui, sans-serif;
      display: grid;
      place-items: center;
      padding: 40px 18px;
    }
    .panel {
      width: min(900px, 94vw);
      padding: 42px;
      border-radius: 32px;
      border: 1px solid rgba(255,215,120,.22);
      background: rgba(8,10,18,.84);
      backdrop-filter: blur(26px);
      box-shadow: 0 30px 90px rgba(0,0,0,.52);
      text-align: center;
    }
    h1 {
      margin: 0;
      font-family: Georgia, serif;
      font-size: clamp(38px, 7vw, 62px);
      font-weight: 400;
      letter-spacing: .1em;
    }
    .gold {
      color: #c8a74d;
      letter-spacing: .28em;
      text-transform: uppercase;
      font-size: 12px;
      font-weight: 900;
      margin: 12px 0 30px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
      margin: 28px 0;
    }
    .metric {
      padding: 22px;
      border-radius: 20px;
      background: rgba(255,255,255,.055);
      border: 1px solid rgba(255,255,255,.08);
    }
    .metric span { display:block; opacity:.65; margin-bottom:8px; }
    .metric strong { font-size:24px; }
    a {
      display:inline-block;
      margin-top:18px;
      padding:14px 18px;
      border-radius:15px;
      border:1px solid rgba(255,215,120,.35);
      background:rgba(200,148,44,.16);
      color:#f6d98b;
      text-decoration:none;
      font-weight:800;
    }
  </style>
</head>

<body>
  <main id="panel" class="panel">Validando fundador...</main>

  <script>
    const SUPABASE_URL = "https://icxrduatkbazvwysvxrg.supabase.co";
    const SUPABASE_ANON_KEY = "PEGA_AQUI_TU_ANON_KEY_SI_ESTA_LINEA_FALLA";
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    window.addEventListener("load", async () => {
      const panel = document.getElementById("panel");

      try {
        await window.Clerk.load();

        const clerkUser = window.Clerk.user;
        if (!clerkUser) {
          window.location.href = "/auth.html";
          return;
        }

        const { data: profile, error } = await supabase
          .from("profiles")
          .select("*")
          .eq("clerk_id", clerkUser.id)
          .single();

        console.log("CLERK USER", clerkUser);
        console.log("FOUNDER PROFILE", profile);
        console.log("FOUNDER ERROR", error);

        const allowed = profile && (
          profile.is_founder === true ||
          profile.username === "nevado" ||
          profile.role === "FOUNDER"
        );

        if (!allowed) {
          panel.innerHTML = `
            <div style="font-size:44px;">🔒</div>
            <h1 style="font-size:32px;">Acceso restringido</h1>
            <p style="opacity:.65;">Solo @nevado puede acceder a este panel.</p>
            <a href="/profile.html">← Volver al perfil</a>
          `;
          return;
        }

        panel.innerHTML = `
          <h1>Panel Fundador</h1>
          <p class="gold">Acceso concedido</p>

          <section class="grid">
            <div class="metric"><span>Usuario</span><strong>@${profile.username}</strong></div>
            <div class="metric"><span>Rol</span><strong>${profile.role}</strong></div>
            <div class="metric"><span>Nivel</span><strong>${profile.level}</strong></div>
            <div class="metric"><span>Croquetas</span><strong>${Number(profile.croquetas || 0).toLocaleString("es-VE")}</strong></div>
          </section>

          <p>Consola inicial del fundador. Próximo paso: gestión de usuarios, croquetas, ascensos y logs.</p>
          <a href="/profile.html">← Volver al perfil</a>
        `;
      } catch (err) {
        console.error("FOUNDER PANEL PAGE ERROR", err);
        panel.innerHTML = "Error validando acceso.";
      }
    });
  </script>
</body>
</html>
