<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Perfil — NODO · NEVADO</title>
  <style>
    body { background: #05050A; display: flex; align-items: center; justify-content: center;
           min-height: 100vh; margin: 0; font-family: system-ui, sans-serif; color: rgba(255,255,255,.4); font-size: 13px; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <link rel="preconnect" href="https://clerk.nevado.pro" crossorigin />
  <script
    data-clerk-publishable-key="pk_live_Y2xlcmsubmV2YWRvLnBybyQ"
    src="https://clerk.nevado.pro/npm/@clerk/clerk-js@latest/dist/clerk.browser.js"
    type="text/javascript"></script>
</head>
<body>
  <p>Redirigiendo a tu perfil…</p>
  <script src="/nevado-env.js"></script>
  <script src="/js/nodo/nodo-core.js"></script>
  <script>
    var redirectDone = false;

    function doRedirect(user) {
      if (redirectDone) return;
      redirectDone = true;
      if (user && user.username) {
        window.location.replace('/u/perfil.html?user=' + encodeURIComponent(user.username));
      } else if (user) {
        window.location.replace('/profile.html');
      } else {
        window.location.replace('/auth.html?redirect=/nodo/perfil.html');
      }
    }

    document.addEventListener('nodo:ready', function (ev) {
      doRedirect(ev.detail && ev.detail.user);
    }, { once: true });

    /* Hard 5s fallback in case Clerk never fires */
    setTimeout(function () { doRedirect(null); }, 5000);

    /* Kick off session resolution */
    if (window.NODO && window.NODO.initClerkSession) {
      window.NODO.initClerkSession();
    } else {
      document.addEventListener('DOMContentLoaded', function () {
        if (window.NODO && window.NODO.initClerkSession) window.NODO.initClerkSession();
      });
    }
  </script>
</body>
</html>
